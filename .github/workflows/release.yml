name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          version="${ref#v}"
          target="${GOOS}_${GOARCH}"
          out="dist/orro_${version}_${target}"
          mkdir -p "$out"
          go build -trimpath \
            -ldflags="-s -w -X github.com/yashiels/orro-cli/internal/config.Version=${version}" \
            -o "$out/orro" \
            ./cmd/orro
          cp README.md LICENSE "$out/"
          tar -C "$out" -czf "dist/orro_${version}_${target}.tar.gz" orro README.md LICENSE
          sha256sum "dist/orro_${version}_${target}.tar.gz" \
            > "dist/orro_${version}_${target}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: orro-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz*

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Flatten
        run: mkdir -p dist && find artifacts -type f -exec cp {} dist/ \;
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*

  update-tap:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Dispatch tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh workflow run update-formula.yml \
            --repo yashiels/homebrew-tap \
            -f formula=orro \
            -f tag="$tag" \
            -f repository=yashiels/orro-cli \
            -f artifact_template='orro_{version}_{target}.tar.gz'
