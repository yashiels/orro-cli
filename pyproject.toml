[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orro"
version = "0.1.0"
description = "CLI for Tuya-based standing desks (Orro and compatible)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Yashiel Sookdeo" }]
keywords = ["tuya", "standing-desk", "orro", "cli", "iot", "tinytuya"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "tinytuya>=1.18.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12",
    "pytest>=8.0",
]

[project.scripts]
orro = "orro.cli:main"

[project.urls]
Repository = "https://github.com/yashiels/orro"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
