version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - noctx

linters-settings:
  goimports:
    local-prefixes: github.com/yashiels/orro-cli

issues:
  exclude-rules:
    # crypto/md5 is required by the Tuya v3.4 protocol — not a security issue.
    - linters: [gosec]
      text: "G501|G401"
    - path: "_test\\.go"
      linters: [errcheck]
